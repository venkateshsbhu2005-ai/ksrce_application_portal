spring.application.name=sdap

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/sdap_db}
spring.datasource.username=${DB_USERNAME:sdap_user}
spring.datasource.password=${DB_PASSWORD:sdap_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret (In production, inject via environment variable)
jwt.secret=${JWT_SECRET:8a4c8a2b1f8d4c9e7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3}
jwt.expiration=86400000

# Server Port
server.port=8080
